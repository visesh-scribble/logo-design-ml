  <title>Gourmet Studio</title>
  <!-- Light theme by default; set before first paint so there is no flash -->
  <script>
    (function () {
      var t = "light";
      try { t = localStorage.getItem("gs-theme-v2") || "light"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
