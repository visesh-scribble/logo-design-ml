services:
  - type: web
    name: restaurant-studio
    runtime: python
    rootDir: restaurant-studio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MONGO_URL      # MongoDB Atlas connection string; set the value in Render > Environment
        sync: false
