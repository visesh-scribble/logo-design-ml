<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <style>
    :root { --brand: #d4af37; --bg: #111827; --ink: #1c1917; --muted: #78716c; --line: #ece9e1; --page: #faf8f3; --go: #15803d; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--page); color: var(--ink); padding-bottom: 90px; }
    header { background: var(--bg) center/cover no-repeat; color: #fff; text-align: center; padding: 64px 16px 34px; }
    header h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 32px; color: #fff; letter-spacing: .5px; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
    header h1::after { content: ""; display: block; width: 56px; height: 3px; border-radius: 3px; background: var(--brand); margin: 10px auto 0; }
    .shop { max-width: 640px; margin: 0 auto 24px; padding: 4px 16px 0; }
    .shop:empty { display: none; }
    .shop p { margin: 6px 0; font-size: 14px; line-height: 1.45; }
    .shop a { color: var(--ink); font-weight: 700; }
    .shop .maps { display: inline-block; margin-top: 10px; background: var(--bg); color: #fff; text-decoration: none; padding: 10px 16px; border-radius: 10px; font-size: 14px; }
    nav a:hover, nav a:focus-visible { border-color: var(--brand); }
    header p { margin: 6px 0 0; font-size: 14px; opacity: .85; }
    nav { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--line); display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav a { flex: none; text-decoration: none; color: var(--ink); font-size: 13px; font-weight: 600; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--page); }
    main { max-width: 640px; margin: 0 auto; padding: 8px 16px 24px; }
    section { scroll-margin-top: 60px; }
    h2 { font-family: Georgia, serif; font-size: 20px; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--brand); }
    .item { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
    .item img { width: 88px; height: 88px; object-fit: cover; border-radius: 12px; flex: none; background: #f1ece6; box-shadow: 0 6px 14px -8px rgba(0,0,0,.35); }
    .item { box-shadow: 0 8px 20px -16px rgba(0,0,0,.3); }
    h2 { color: var(--bg); }
    nav a { background: #fff; }
    .info { flex: 1; min-width: 0; }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .name { font-weight: 700; font-size: 15px; }
    .price { font-weight: 700; color: var(--bg); white-space: nowrap; }
    .desc { color: var(--muted); font-size: 13px; margin-top: 3px; line-height: 1.4; }
    .actions { display: flex; justify-content: flex-end; margin-top: 8px; }
    .add { border: 1.5px solid var(--go); color: var(--go); background: #f0fdf4; font-weight: 800; font-size: 13px; padding: 6px 18px; border-radius: 10px; cursor: pointer; }
    .qty { display: inline-flex; align-items: center; background: var(--go); color: #fff; border-radius: 10px; overflow: hidden; }
    .qty button { background: none; border: 0; color: #fff; font-size: 18px; font-weight: 800; width: 34px; height: 32px; cursor: pointer; }
    .qty span { min-width: 22px; text-align: center; font-weight: 800; font-size: 14px; }
    .dot { display: inline-block; width: 12px; height: 12px; border: 1.5px solid; border-radius: 2px; margin-right: 6px; vertical-align: -1px; position: relative; }
    .dot::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: currentColor; }
    .veg { color: #15803d; } .nonveg { color: #b91c1c; }
    .msg { text-align: center; color: var(--muted); padding: 60px 16px; }

    /* Bottom cart bar */
    #cartBar { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 5; max-width: 616px; margin: 0 auto; background: var(--go); color: #fff; border: 0; border-radius: 14px; padding: 14px 18px; display: none; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.2); cursor: pointer; }
    #cartBar.show { display: flex; }

    /* Cart sheet */
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: none; }
    .sheet-bg.show { display: block; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; background: #fff; border-radius: 20px 20px 0 0; padding: 18px 16px 20px; max-height: 88vh; overflow-y: auto; }
    .sheet h3 { margin: 0 0 12px; font-family: Georgia, serif; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
    .close { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--muted); cursor: pointer; }
    .cline { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .cline .n { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; }
    .cline .p { font-weight: 700; font-size: 14px; min-width: 70px; text-align: right; }
    .total { display: flex; justify-content: space-between; font-size: 17px; font-weight: 800; padding: 14px 0 6px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 5px; }
    input, textarea { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid #d6d3cb; border-radius: 10px; background: var(--page); }
    .primary { width: 100%; margin-top: 16px; background: var(--go); color: #fff; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer; }
    .primary:disabled { opacity: .6; }
    .err { color: #b91c1c; font-size: 13px; margin-top: 8px; min-height: 1em; }
    .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 10px; }

    /* ML recommendations */
    .recs-h { font-weight: 800; font-size: 14px; margin: 16px 0 8px; }
    .recs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .recs::-webkit-scrollbar { display: none; }
    .rec { flex: 0 0 150px; border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--page); display: flex; flex-direction: column; gap: 4px; }
    .rec img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; background: #f1ece6; }
    .rec .rn { font-weight: 700; font-size: 13px; line-height: 1.25; }
    .rec .rr { color: var(--muted); font-size: 11px; }
    .rec .rp { display: flex; justify-content: space-between; align-items: center; margin-top: auto; font-size: 13px; }
    .rec .add { padding: 4px 10px; font-size: 12px; }

    /* Order placed */
    .done { text-align: center; padding: 10px 0; }
    .done .tick { width: 64px; height: 64px; border-radius: 50%; background: #dcfce7; color: var(--go); font-size: 36px; line-height: 64px; margin: 0 auto 10px; }
    .done .num { font-size: 32px; font-weight: 900; margin: 4px 0; }
    .status { display: inline-block; margin-top: 8px; padding: 6px 14px; border-radius: 999px; font-weight: 800; font-size: 13px; background: #fef3c7; color: #92400e; }
    .status.ready { background: #dcfce7; color: var(--go); }
  </style>
</head>
<body>
  <header><h1 id="brandName">Menu</h1><p id="tagline"></p></header>
  <nav id="catNav"></nav>
  <main id="menu"><p class="msg">Loading menu…</p></main>
  <aside id="shopInfo" class="shop"></aside>

  <button id="cartBar" onclick="openCart()"><span id="cartCount"></span><span>View Cart ›</span></button>

  <div id="sheetBg" class="sheet-bg" onclick="if (event.target === this) closeCart()">
    <div class="sheet" id="sheet"></div>
  </div>

  <script>
    const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
    let MENU = null;        // { brand, menu }
    const cart = {};        // key "c-i" -> qty
    let lastOrderId = null, pollTimer = null;

    const num = p => { const n = parseFloat(String(p).replace(/,/g, "")); return isNaN(n) ? 0 : n; };
    function money(n) {
      const cur = MENU.menu.currency;
      const v = Number.isInteger(n) ? String(n) : n.toFixed(2);
      return cur === "/-" ? `${v}/-` : `${cur || ""}${v}`;
    }
    const itemAt = key => { const [c, i] = key.split("-").map(Number); return MENU.menu.categories[c].items[i]; };

    function vegDot(item) {
      const d = (item.dietary || []).join(" ").toLowerCase();
      if (/non[\s-]?veg/.test(d)) return '<span class="dot nonveg" title="Non-Veg"></span>';
      if (/\bveg|vegan|vegetarian/.test(d)) return '<span class="dot veg" title="Veg"></span>';
      return "";
    }

    function qtyControl(key) {
      const q = cart[key] || 0;
      if (!q) return `<button class="add" onclick="change('${key}', 1)">+ ADD</button>`;
      return `<span class="qty"><button onclick="change('${key}', -1)" aria-label="Remove one">−</button><span>${q}</span><button onclick="change('${key}', 1)" aria-label="Add one">+</button></span>`;
    }

    function change(key, d) {
      cart[key] = Math.max(0, Math.min(99, (cart[key] || 0) + d));
      if (!cart[key]) delete cart[key];
      document.querySelectorAll(`[data-key="${key}"]`).forEach(el => el.innerHTML = qtyControl(key));
      updateBar();
      if (document.getElementById("sheetBg").classList.contains("show") && !lastOrderId) renderCart();
    }

    function cartTotals() {
      let count = 0, total = 0;
      for (const k in cart) { count += cart[k]; total += cart[k] * num(itemAt(k).price); }
      return { count, total };
    }

    function updateBar() {
      const { count, total } = cartTotals();
      document.getElementById("cartBar").classList.toggle("show", count > 0);
      document.getElementById("cartCount").textContent = `${count} item${count > 1 ? "s" : ""} · ${money(total)}`;
    }

    function openCart() { lastOrderId = null; recsFor = ""; renderCart(); document.getElementById("sheetBg").classList.add("show"); }
    function closeCart() { document.getElementById("sheetBg").classList.remove("show"); clearInterval(pollTimer); }

    function renderCart() {
      const keys = Object.keys(cart);
      const { total } = cartTotals();
      const sheet = document.getElementById("sheet");
      if (!keys.length) {
        sheet.innerHTML = `<h3>Your Cart <button class="close" onclick="closeCart()">×</button></h3><p class="msg" style="padding:30px 0">Your cart is empty.</p>`;
        return;
      }
      const saved = { table: val("table"), name: val("cname"), note: val("note") };
      sheet.innerHTML = `
        <h3>Your Cart <button class="close" onclick="closeCart()">×</button></h3>
        ${keys.map(k => { const it = itemAt(k); return `
          <div class="cline">
            <span class="n">${vegDot(it)}${esc(it.name)}</span>
            <span data-key="${k}">${qtyControl(k)}</span>
            <span class="p">${money(cart[k] * num(it.price))}</span>
          </div>`; }).join("")}
        <div id="recs">${recsHtml}</div>
        <div class="total"><span>Total</span><span>${money(total)}</span></div>
        <label for="table">Table number *</label>
        <input id="table" inputmode="numeric" placeholder="e.g. 5" value="${esc(saved.table)}">
        <label for="cname">Your name (optional)</label>
        <input id="cname" placeholder="e.g. Rahul" value="${esc(saved.name)}">
        <label for="note">Cooking instructions (optional)</label>
        <textarea id="note" rows="2" placeholder="e.g. Less spicy, no onion">${esc(saved.note)}</textarea>
        <div class="err" id="err"></div>
        <button class="primary" id="placeBtn" onclick="placeOrder()">Place Order · ${money(total)}</button>
        <p class="hint">Pay at the counter after your meal.</p>`;
      loadRecs(keys);
    }

    // ML recommendations: learned from past orders, or from dish descriptions before there are any
    let recsHtml = "", recsFor = "";
    function loadRecs(keys) {
      const sig = keys.slice().sort().join(",");
      if (sig === recsFor) return;
      recsFor = sig;
      fetch("/api/ml/recommend", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slug: SLUG, cart: keys }) })
        .then(r => r.json())
        .then(res => {
          if (sig !== recsFor) return;
          const recs = (res.success && res.items) || [];
          recsHtml = recs.length ? `
            <div class="recs-h">✨ Goes well with your order</div>
            <div class="recs">${recs.map(r => { const key = `${r.c}-${r.i}`, it = itemAt(key); return `
              <div class="rec">
                <img src="${esc(dishPhoto(it, MENU.brand && MENU.brand.cuisine))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
                <div class="rn">${vegDot(it)}${esc(it.name)}</div>
                <div class="rr">${esc(r.reason)}</div>
                <div class="rp"><b>${it.price !== "" && it.price != null ? money(num(it.price)) : ""}</b><button class="add" onclick="change('${key}', 1)">+ ADD</button></div>
              </div>`; }).join("")}</div>` : "";
          const el = document.getElementById("recs");
          if (el) el.innerHTML = recsHtml;
        })
        .catch(() => {});
    }
    const val = id => { const el = document.getElementById(id); return el ? el.value : ""; };

    function placeOrder() {
      const table = val("table").trim();
      const err = document.getElementById("err");
      if (!table) { err.textContent = "Please enter your table number."; document.getElementById("table").focus(); return; }
      const btn = document.getElementById("placeBtn");
      btn.disabled = true; btn.textContent = "Placing order…";
      const items = Object.keys(cart).map(k => { const [c, i] = k.split("-").map(Number); return { c, i, qty: cart[k] }; });
      fetch("/api/orders", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ slug: SLUG, table, name: val("cname"), note: val("note"), items })
      })
        .then(r => r.json())
        .then(res => {
          if (!res.success) throw new Error(res.error);
          for (const k in cart) delete cart[k];
          document.querySelectorAll("[data-key]").forEach(el => el.innerHTML = qtyControl(el.dataset.key));
          updateBar();
          showPlaced(res.order);
        })
        .catch(e => { err.textContent = e.message; btn.disabled = false; btn.textContent = "Try Again"; });
    }

    const STATUS_TEXT = { new: "Order received", preparing: "Being prepared 👨‍🍳", ready: "Ready! 🎉", done: "Served — enjoy your meal!" };

    function showPlaced(order) {
      lastOrderId = order.id;
      document.getElementById("sheet").innerHTML = `
        <h3><span></span><button class="close" onclick="closeCart()">×</button></h3>
        <div class="done">
          <div class="tick">✓</div>
          <div style="font-weight:700">Order placed!</div>
          <div class="num">#${order.id}</div>
          <div style="color:var(--muted);font-size:14px">Table ${esc(order.table)} · ${money(order.total)}</div>
          <div id="orderStatus" class="status">${STATUS_TEXT[order.status]}</div>
          <p class="hint">This screen updates by itself when the kitchen changes your order.</p>
          <button class="primary" onclick="closeCart()">Back to Menu</button>
        </div>`;
      clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        fetch(`/api/orders/${order.id}`).then(r => r.json()).then(res => {
          const el = document.getElementById("orderStatus");
          if (!res.success || !el) return;
          el.textContent = STATUS_TEXT[res.order.status];
          el.classList.toggle("ready", res.order.status === "ready" || res.order.status === "done");
        }).catch(() => {});
      }, 4000);
    }

    // Page name = hotel name, e.g. /spice-garden.html -> slug "spice-garden" (m.html = latest menu)
    const SLUG = decodeURIComponent(location.pathname.split("/").pop().replace(/\.html$/, ""));
    const CUISINE_PHOTO = {
      veg: "photo-1601050690597-df0568f70950", indian: "photo-1585937421612-70a008356fbe", chinese: "photo-1585032226651-759b368d7246",
      bistro: "photo-1512621776951-a57141f2eefd", italian: "photo-1513104890138-7c749659a591", finedining: "photo-1414235077428-338989a2e8c0",
      cafe: "photo-1509042239860-f550ce710b93", burger: "photo-1568901346375-23c9450c58cd", other: "photo-1504674900247-0877df9cc836"
    };
    // A photo for every dish: its own photo if it has one, else matched by the dish name, else the cuisine photo.
    const DISH_PHOTOS = [
      [/soup|shorba|rasam/, "photo-1547592166-23ac45744acd"],
      [/momo|kothe|dim ?sum|dumpling/, "photo-1534422298391-e4f8c172dddb"],
      [/wonton/, "photo-1625220194771-7ebdea0b70b9"],
      [/garlic bread|bread roll|\bpav\b|\bbuns?\b/, "photo-1606491956689-2ea866880c84"],
      [/spring roll|\brolls?\b|wrap|frankie|kathi|burrito/, "photo-1626700051175-6818013e1d4f"],
      [/pasta|spaghetti|penne|tagliolini|pappardelle|risotto/, "photo-1563379926898-05f4575a45d8"],
      [/noodle|chow ?mein|hakka|ramen/, "photo-1585032226651-759b368d7246"],
      [/biryani|pulao/, "photo-1631515242808-497c3fbd3972"],
      [/fried rice|\brice\b/, "photo-1603133872878-684f208fb84b"],
      [/manchurian|chilli|chili|\b65\b|schezwan/, "photo-1604908176997-125f25cc6f3d"],
      [/paneer/, "photo-1588166524941-3bf61a9c41db"],
      [/tikka|tandoor|kebab|kabab|seekh/, "photo-1567188040759-fb8a883dc6d8"],
      [/chicken|lollipop|wings/, "photo-1532550907401-a500c9a57435"],
      [/fish|prawn|shrimp|seafood|crab|branzino|salmon/, "photo-1574484284002-952d92456975"],
      [/mutton|lamb|steak|beef|brisket|ossobuco|carpaccio/, "photo-1573225342350-16731dd9bf3d"],
      [/\bdal\b|curry|masala|kofta|korma|makhan|makhni|kadhai|kadai/, "photo-1596797038530-2c107229654b"],
      [/roti|naan|paratha|kulcha|chapati/, "photo-1567337710282-00832b415979"],
      [/thali|meal|combo|aloo|bhindi|sabzi|mixed veg/, "photo-1626777552726-4a6b54c97e46"],
      [/samosa|pakora|bhaji|vada|kachori/, "photo-1601050690597-df0568f70950"],
      [/idli|dosa|uttapam/, "photo-1589301760014-d929f3979dbc"],
      [/fries|chips|wedges|potato/, "photo-1573080496219-bb080dd4f877"],
      [/burger/, "photo-1568901346375-23c9450c58cd"],
      [/pizza/, "photo-1513104890138-7c749659a591"],
      [/sandwich|toast|tartine|brioche|bruschetta/, "photo-1619860860774-1e2e17343432"],
      [/salad|bowl|poke/, "photo-1512621776951-a57141f2eefd"],
      [/ice ?cream|gelato|kulfi|sundae|affogato/, "photo-1497034825429-c343d7c6a68f"],
      [/cake|pastry|brownie|cheesecake|tart|torta|babka|croissant|muffin/, "photo-1578985545062-69928b1d9587"],
      [/donut|doughnut|dessert|sweet|gulab|halwa|jamun|dolci/, "photo-1551024601-bec78aea704b"],
      [/pancake|waffle/, "photo-1567620905732-2d1ec7ab7445"],
      [/coffee|latte|cappuccino|espresso|cortado|mocha|pour-over|americano/, "photo-1509042239860-f550ce710b93"],
      [/\btea\b|\bchai\b/, "photo-1576092768241-dec231879fc3"],
      [/cocktail|mocktail|\bipa\b|beer|wine|brew|margarita/, "photo-1544145945-f90425340c7e"],
      [/juice|shake|smoothie|lassi|mojito|soda|lemonade|cola|drink|beverage/, "photo-1556679343-c7306c1976bc"],
      [/corn|cheese ball|nuggets|fritter|crispy/, "photo-1601050690117-94f5f6fa8bd7"]
    ];
    function dishPhoto(it, cuisine) {
      if (it.photo) return it.photo;
      const t = String(it.name || "").toLowerCase() + " " + String(it.description || "").toLowerCase();
      const hit = DISH_PHOTOS.find(([re]) => re.test(String(it.name || "").toLowerCase())) || DISH_PHOTOS.find(([re]) => re.test(t));
      const id = hit ? hit[1] : (CUISINE_PHOTO[cuisine] || CUISINE_PHOTO.other);
      return `https://images.unsplash.com/${id}?w=240&h=240&q=65&auto=format&fit=crop`;
    }

    fetch("/api/published-menu" +(SLUG && SLUG !== "m" ? "?slug=" + encodeURIComponent(SLUG) : ""))
      .then(r => r.json())
      .then(res => {
        if (!res.success) throw new Error(res.error);
        MENU = res.data;
        const { brand = {}, menu = {} } = MENU;
        const root = document.documentElement.style;
        if (brand.primaryColor) root.setProperty("--brand", brand.primaryColor);
        if (brand.bgColor) root.setProperty("--bg", brand.bgColor);
        document.title = (brand.name || "Our") + " Menu";
        document.getElementById("brandName").textContent = brand.name || "Menu";
        document.getElementById("tagline").textContent = brand.tagline || "";
        const photo = CUISINE_PHOTO[brand.cuisine] || CUISINE_PHOTO.other;
        document.querySelector("header").style.backgroundImage =
          `linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.75)), url(https://images.unsplash.com/${photo}?w=900&q=70&auto=format&fit=crop)`;

        const shop = menu.shop || {};
        const mapUrl = shop.mapLink ? (/^https?:\/\//i.test(shop.mapLink) ? shop.mapLink : "https://" + shop.mapLink)
          : shop.coords ? "https://www.google.com/maps/search/?api=1&query=" + shop.coords
          : shop.address ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent((brand.name ? brand.name + ", " : "") + shop.address) : "";
        if (shop.address || shop.phone || shop.hours || shop.extra) {
          document.getElementById("shopInfo").innerHTML = `
            <h2>Visit us</h2>
            ${shop.address ? `<p>📍 ${esc(shop.address)}</p>` : ""}
            ${shop.phone ? `<p>📞 <a href="tel:${esc(shop.phone.replace(/[^\d+]/g, ""))}">${esc(shop.phone)}</a></p>` : ""}
            ${shop.hours ? `<p>🕒 ${esc(shop.hours)}</p>` : ""}
            ${shop.extra ? `<p>ℹ️ ${esc(shop.extra)}</p>` : ""}
            ${mapUrl ? `<a class="maps" href="${esc(mapUrl)}" target="_blank" rel="noopener">Open in Google Maps</a>` : ""}`;
        }

        const cats = menu.categories || [];
        if (!cats.length) throw new Error("This menu has no items yet.");

        document.getElementById("catNav").innerHTML =
          cats.map((c, i) => `<a href="#cat${i}">${esc(c.name)}</a>`).join("");

        document.getElementById("menu").innerHTML = cats.map((c, ci) => `
          <section id="cat${ci}">
            <h2>${esc(c.name)}</h2>
            ${(c.items || []).map((it, ii) => `
              <div class="item">
                <img src="${esc(dishPhoto(it, brand.cuisine))}" alt="${esc(it.name)}" loading="lazy" onerror="this.style.visibility='hidden'">
                <div class="info">
                  <div class="row">
                    <span class="name">${vegDot(it)}${esc(it.name)}</span>
                    <span class="price">${esc(it.price !== "" && it.price != null ? money(num(it.price)) : "")}</span>
                  </div>
                  ${(it.description || it.tagline) ? `<div class="desc">${esc(it.description || it.tagline)}</div>` : ""}
                  <div class="actions" data-key="${ci}-${ii}">${qtyControl(`${ci}-${ii}`)}</div>
                </div>
              </div>`).join("")}
          </section>`).join("");
      })
      .catch(err => {
        document.getElementById("menu").innerHTML =
          `<p class="msg">Menu not available.<br>${esc(err.message)}</p>`;
      });
  </script>
</body>
</html>
